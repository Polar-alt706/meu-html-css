<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do veículo: <input type="number" name="txtvel" id="txtvel"> Km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="out"></div>
    <script>
        function calcular() {
        var txtv = document.querySelector('input#txtvel')
        var out = document.querySelector('div#out')
        var vel = Number(txtv.value)
        out.innerHTML = 'Sua velocidade atual é ' + vel + 'Km/h <br>' 
        if (vel > 60) {
            out.innerHTML += 'Limite de velocidade ultrapassado! <strong>Multado.</strong> <br>'
        }
        out.innerHTML += 'Dirija sempre com cinto de segurança!'
    }
    </script>
</body>
</html>
