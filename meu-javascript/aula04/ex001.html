<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro script</title>
</head>
<body>
    <p>Olá, mundo!</p>
    <script>
        window.alert("Minha primeira mensagem")

    </script>
