<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.php" method="post">
        <p>
            <label for="iuser">
                Nome:
            </label>
            <input type="text" name="user" id="iuser" required minlength="5" maxlength="17">
        </p>
        <p>
            <label for="ipass">Senha</label>
            <input type="password" name="password" id="ipass" required minlength="5" maxlength="17">
        </p>
        <p>
            <input type="submit" value="Enviar"> 
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
