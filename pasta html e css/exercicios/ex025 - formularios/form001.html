<!DOCTYPE html>
<html lang="pt-r">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Meu primeiro formualario</h1>
    <form>
        <!--autocomplete desativa ou ativa o auto complete dos formularios
        o parametro action envia dados para uma linguagem, ex: action=cadastro.php-->
        <p>
            <label for="nome">Nome:</label>
            <!--liga a etiqueta a caixa do formulario-->
            <input type="text" name="nome" id="nome">
        </p>
        <p>
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" name="sobrenome" id="sobrenome">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
