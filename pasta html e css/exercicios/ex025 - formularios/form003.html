<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iname">
                Nome:
            </label>
            <input type="text" name="name" id="iname" autocomplete="username" placeholder="Seu nome completo" size="20" minlength="10" required>
        </p>
        <p>
            <label for="average">
                Média:
            </label>
            <input type="number" name="average" id="average" placeholder="0-10" min="0" max="10">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
