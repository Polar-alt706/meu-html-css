<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
       body {
        font-family: Arial, Helvetica, sans-serif ;
       }
       table
        {
            width: 500px;
        }
       td,th {
            border: 1px solid black;
            text-align: center;
        }
        thead
        {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <!--
    ANATOMIA
        TABLE
            THEAD
                TR,TD,TH
            TBODY
                TR,TD,TH
            TFOOT
                TR,TD,TH
    -->
    <h1>Uso de tabelas Grandes</h1>
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São paulo</td>
                <td>45 919 049</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</body>
</html>
