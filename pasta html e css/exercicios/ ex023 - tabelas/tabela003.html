<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de células</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
            min-width: 60%; 
            max-width: 900px;
        }
        td
        {
            padding: 10px;
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            <!--col span configura o quanto uma coluna ocupa horizontalmente-->
        </tr>
        <tr>
            <td colspan="2">D</td>
            <td rowspan="2">F</td>
        </tr>
        <tr>
            <td rowspan="2">G</td>
            <td>H</td>
        </tr>
        <tr>
            <td colspan="2">K</td>
        </tr>
    </table>
</body>
</html>
