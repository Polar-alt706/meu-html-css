<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Escolar</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            max-width: 700px;
            border: 2px solid gray;
        }
        thead
        {
            background-color: black;
            color: white;
        }
        td , table , tr , th {
            padding: 20px;
        }
        .media {
            background-color: rgb(81, 80, 80);
            color: white;
        }
        th
        {
            border: 1px solid rgb(255, 255, 255);
        }
        td
        {
            border: 1px solid black;
            text-align: justify;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Area</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <td>1º Bimestre</th>
                <td>2º Bimestre</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="4">
                            Exatas
                </td>
                <td>Matematica</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>

            <tr>
                <td>Fisica</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>
            <tr class="media">
                <td colspan="4">
                    Média de exatas
                </td>
                <td>
                    0,0
                </td>
            </tr>
            <tr>
                <td rowspan="2">
                    Humanas
                </td>
                <td>Geografia</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>
            <tr>
                <td>Historia</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="media">
                <td colspan="4">
                    Média de humanas
                </td>
                <td>
                    0,0
                </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
